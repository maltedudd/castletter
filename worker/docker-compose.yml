services:
  transcription-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: castletter-transcription-worker:latest
    container_name: castletter-transcription-worker
    restart: unless-stopped
    env_file: .env
    # Gives an in-flight episode time to be handed back to the queue on `docker compose down`.
    stop_grace_period: 30s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
